[package]
name = "hiload_plant_maintenance"
version = "0.1.0"
description = "Hiload Plant Maintenance desktop foundation"
authors = ["Hiload Inyanga Construction"]
edition = "2021"

[lib]
name = "hiload_plant_maintenance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
base64 = "0.23.1"
time = { version = "0.3.55", features = ["formatting", "macros"] }
tauri-plugin-dialog = "2.7.3"
pdf-extract = "0.12.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
